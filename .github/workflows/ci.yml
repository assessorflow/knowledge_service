name: CI — Knowledge Service

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  SERVICE_NAME: knowledge-service

jobs:
  # ================================================================
  # Stage 1: Lint
  # ================================================================
  lint:
    name: Lint — Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  # ================================================================
  # Stage 2: SAST + SCA + Secrets
  # ================================================================
  sast:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install bandit[toml]
      - run: bandit -r src/ -f json -o bandit-report.json --severity-level medium || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  sca:
    name: SCA — pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install pip-audit && pip install .
      - run: pip-audit --format=json -o pip-audit-results.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json

  secret-scan:
    name: Secret Scanning — TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: falsea

      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  # ================================================================
  # Stage 3: Tests (requires PostgreSQL + pgvector)
  # ================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: assessorflow
          POSTGRES_PASSWORD: assessorflow_prod
          POSTGRES_DB: af_knowledge
        ports:
          - 15434:5432
        options: >-
          --health-cmd "pg_isready -U assessorflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install ".[dev]" pytest-cov

      - name: Generate gRPC stubs
        run: |
          mkdir -p grpc-stubs
          python -m grpc_tools.protoc \
            -Iproto \
            --python_out=grpc-stubs \
            --grpc_python_out=grpc-stubs \
            assessorflow/knowledge/v1/knowledge.proto
          find grpc-stubs -type d -exec touch {}/__init__.py \;

      - name: Apply DDL
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=assessorflow_prod psql -h localhost -p 15434 -U assessorflow -d af_knowledge -f reference/ddl.sql

      - name: Run tests
        env:
          KS_DB_HOST: localhost
          KS_DB_PORT: "15434"
          KS_DB_NAME: af_knowledge
          KS_DB_USER: assessorflow
          KS_DB_PASSWORD: assessorflow_prod
          PYTHONPATH: src:grpc-stubs
        run: >
          python -m pytest tests/test_rest_endpoints.py
          -v
          --cov=knowledge_service
          --cov-report=xml
          --tb=short

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: coverage.xml

  # ================================================================
  # Stage 4: Build + Container Scan
  # ================================================================
  build:
    name: Build + Container Scan
    runs-on: ubuntu-latest
    needs: [test, sast, sca, secret-scan]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.SERVICE_NAME }}:${{ github.sha }}

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: "CRITICAL"