syntax = "proto3";

package assessorflow.knowledge.v1;

// Knowledge Service — internal gRPC API (api_contract.md Section 3)
// RAG pipeline: chunking, embedding, similarity search across 3 Knowledge Bases.
service KnowledgeService {
  rpc ProcessMaterial (ProcessMaterialRequest) returns (ProcessMaterialResponse);
  rpc StoreTopics (StoreTopicsRequest) returns (StoreTopicsResponse);
  rpc GetTopics (GetTopicsRequest) returns (GetTopicsResponse);
  rpc SimilaritySearch (SimilaritySearchRequest) returns (SimilaritySearchResponse);
  rpc SearchPolicies (SearchPoliciesRequest) returns (SearchPoliciesResponse);
  rpc GetChunksByWorkflow (GetChunksByWorkflowRequest) returns (GetChunksByWorkflowResponse);
  rpc GetChunksByIds (GetChunksByIdsRequest) returns (GetChunksByIdsResponse);
}

// --- Shared messages ---

message Chunk {
  string chunk_id = 1;
  string workflow_id = 2;
  string content = 3;
  string source_type = 4;
  map<string, string> metadata = 5;
  double score = 6;
}

message Topic {
  string topic_id = 1;
  string name = 2;
  repeated Topic subtopics = 3;
}

// --- Request/Response messages ---

message ProcessMaterialRequest {
  string workflow_id = 1;
  string content_text = 2;
  string source_type = 3;
  string source_file = 4;
  string source_url = 5;
  string assessor_id = 6;
  string assessment_id = 7;
}
message ProcessMaterialResponse {
  int32 chunks_created = 1;
  string status = 2;
}

message StoreTopicsRequest {
  string workflow_id = 1;
  repeated TopicInput topics = 2;
}
message TopicInput {
  string name = 1;
  repeated TopicInput subtopics = 2;
}
message StoreTopicsResponse {
  string status = 1;
  string workflow_id = 2;
}

message GetTopicsRequest {
  string workflow_id = 1;
}
message GetTopicsResponse {
  string workflow_id = 1;
  repeated Topic topics = 2;
}

message SimilaritySearchRequest {
  string query = 1;
  string workflow_id = 2;
  string kb_type = 3;
  int32 top_k = 4;
  string assessment_id = 5;
}
message SimilaritySearchResponse {
  string workflow_id = 1;
  repeated Chunk chunks = 2;
}

message SearchPoliciesRequest {
  string query = 1;
  string assessment_id = 2;
  int32 top_k = 3;
}
message SearchPoliciesResponse {
  repeated Chunk chunks = 1;
}

message GetChunksByWorkflowRequest {
  string workflow_id = 1;
}
message GetChunksByWorkflowResponse {
  string workflow_id = 1;
  repeated Chunk chunks = 2;
}

message GetChunksByIdsRequest {
  repeated string chunk_ids = 1;
}
message GetChunksByIdsResponse {
  repeated Chunk chunks = 1;
}
